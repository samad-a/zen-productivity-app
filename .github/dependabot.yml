version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # These are released and upgraded together: KSP and Room's compiler
      # must match the Kotlin version, and AGP pins a minimum Kotlin.
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "androidx.room*"
      # Listed before androidx: a dependency joins the first group it matches
      testing:
        patterns:
          - "junit*"
          - "androidx.test*"
          - "androidx.arch.core*"
      androidx:
        patterns:
          - "androidx.*"
          - "com.google.android.material*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
